# Production-specific settings
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${EUREKA_INSTANCE_IP:127.0.0.1}

# Security settings
eureka.client.serviceUrl.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

# Enable metrics for monitoring
management.metrics.export.simple.enabled=true

# Logging settings
logging.file.name=/home/ubuntu/service-discovery-service/eureka.log
logging.file.max-size=10MB
logging.file.max-history=10

# Connection timeouts
eureka.server.peer-node-connect-timeout-ms=2000
eureka.server.peer-node-read-timeout-ms=2000
