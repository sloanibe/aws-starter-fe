spring:
  application:
    name: email-service
  cloud:
    config:
      uri: http://${IP_ADDRESS:13.52.157.48}:8888
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 2000
        multiplier: 1.1

# Server configuration
server:
  port: ${SERVER_PORT:8082}

# Eureka client configuration
eureka:
  client:
    serviceUrl:
      defaultZone: http://${IP_ADDRESS:13.52.157.48}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: ${IP_ADDRESS:127.0.0.1}
