# This file is kept as a fallback but configuration is primarily in bootstrap.yml and from Config Server

# Spring Config Import
spring.config.import=optional:configserver:http://${IP_ADDRESS:13.52.157.48}:8888

# Actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging configuration
logging.level.com.example.emailservice=INFO
logging.level.org.springframework.amqp=INFO

# JVM memory optimization for t2.small
spring.jvm.memory=-Xmx256m -Xms128m

# RabbitMQ Configuration (will be used when RabbitMQ is added)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# AWS SES Configuration
aws.ses.region=${AWS_REGION:us-west-1}
aws.ses.sender-email=${SENDER_EMAIL:admin@sloandev.net}
aws.ses.template-name=${TEMPLATE_NAME:login-notification-dev}
