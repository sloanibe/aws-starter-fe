# Minimal bootstrap configuration for AWS Starter API Service
# This file contains only the configuration needed to connect to the Config Server

spring:
  application:
    name: aws-starter-api
  cloud:
    config:
      uri: http://${IP_ADDRESS:13.52.157.48}:8888
      fail-fast: false
      retry:
        initial-interval: 1000
        max-interval: 2000
        max-attempts: 6

# Fallback port in case Config Server is unavailable
server:
  port: ${SERVER_PORT:8080}

# Eureka Client Configuration - minimal for service discovery
eureka:
  client:
    serviceUrl:
      defaultZone: http://${IP_ADDRESS:13.52.157.48}:8761/eureka/
