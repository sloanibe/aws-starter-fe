# Production-specific configuration overrides for aws-starter-api

server:
  compression:
    enabled: true

management:
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  data:
    mongodb:
      # Use environment variables for production credentials
      uri: mongodb://${MONGO_USER}:${MONGO_PWD}@13.52.157.48:27017/aws_starter_db?authSource=admin&connectTimeoutMS=3000

aws:
  region: us-west-1
  ses:
    template-name: guest-visit-notification
    welcome-template-name: login-notification

# Eureka Client Configuration - use actual service URL in production
eureka:
  client:
    serviceUrl:
      defaultZone: http://13.52.157.48:8761/eureka/
  instance:
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# Application specific settings
app:
  cors:
    allowed-origins: https://sloandev.net,https://www.sloandev.net,https://api.sloandev.net
  rate-limit:
    enabled: true
    requests-per-second: 20
