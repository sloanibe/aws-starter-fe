# API Gateway Service Configuration
# Default configuration for all environments

# Server configuration
server:
  port: ${SERVER_PORT:8090}

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://13.52.157.48:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Gateway routes configuration
spring:
  cloud:
    gateway:
      routes:
        # Login Service route - must be before the api-service route for proper precedence
        # Using Eureka service discovery with path rewriting to fix path duplication
        - id: login-service
          uri: lb://LOGIN-SERVICE
          predicates:
            - Path=/api/login,/api/login/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
          metadata:
            connect-timeout: 5000
            response-timeout: 5000
            
        # General API Service route for all other API requests
        - id: api-service
          uri: lb://AWS-STARTER-API
          predicates:
            - Path=/api/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

# Actuator endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,routes
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  health:
    defaults:
      enabled: true

# Logging configuration
logging:
  file:
    name: /var/log/api-gateway-service.log
  level:
    root: INFO
    com.example.apigateway.filter: DEBUG
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.gateway.handler.predicate: TRACE
    org.springframework.web: TRACE
    reactor.netty: DEBUG
    org.springframework.http.server.reactive: TRACE
    org.springframework.boot.web.reactive: TRACE

# JVM memory optimization for t2.small
spring:
  jvm:
    memory: -Xmx256m -Xms128m
