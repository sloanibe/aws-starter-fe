# Application name and port
spring.application.name=config-server-service
server.port=8888

# Config Server configuration
# Point to the GitHub repository containing configuration files
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/sloanibe/aws-starter-fe}
spring.cloud.config.server.git.username=${CONFIG_GIT_USERNAME:}
spring.cloud.config.server.git.password=${CONFIG_GIT_PASSWORD:}
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.search-paths=config-repo

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging configuration
logging.level.org.springframework.cloud=INFO
logging.level.org.springframework.boot=INFO

# JVM memory optimization for t2.micro
spring.jvm.memory=-Xmx256m -Xms128m
