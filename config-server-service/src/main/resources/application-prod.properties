# Production-specific settings
server.address=0.0.0.0

# Security settings for Git repository access
# These values will be provided by environment variables in production
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI}
spring.cloud.config.server.git.username=${CONFIG_GIT_USERNAME}
spring.cloud.config.server.git.password=${CONFIG_GIT_PASSWORD}
spring.cloud.config.server.git.timeout=10
spring.cloud.config.server.git.force-pull=true
spring.cloud.config.server.git.default-label=feature/resume-component-2
spring.cloud.config.server.git.search-paths=config-repo

# Eureka Client Configuration for production
eureka.client.service-url.defaultZone=http://13.52.157.48:8761/eureka/
eureka.instance.hostname=${HOSTNAME:localhost}
eureka.instance.ip-address=${IP_ADDRESS:13.52.157.48}
eureka.instance.prefer-ip-address=true

# Enable metrics for monitoring
management.metrics.export.simple.enabled=true

# Logging settings
logging.file.name=/home/ubuntu/config-server-service/config-server.log
logging.file.max-size=10MB
logging.file.max-history=10

# Connection timeouts
spring.cloud.config.server.timeout=5
