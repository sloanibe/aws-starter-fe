# Production-specific settings
server.port=${SERVER_PORT:8090}

# Config Server connection with explicit IP for production
spring.config.import=optional:configserver:http://${IP_ADDRESS:13.52.157.48}:8888

# Eureka Client Configuration with explicit IP for production
eureka.client.service-url.defaultZone=http://${IP_ADDRESS:13.52.157.48}:8761/eureka/
eureka.instance.hostname=${HOSTNAME:api-gateway}
eureka.instance.ip-address=${IP_ADDRESS:13.52.157.48}

# Logging configuration - more concise in production
logging.level.org.springframework.cloud.gateway=WARN
logging.level.org.springframework.web=WARN
logging.level.reactor.netty=WARN

# Disable development-specific features
spring.devtools.restart.enabled=false
