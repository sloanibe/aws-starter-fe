# Application name and port
spring.application.name=api-gateway-service
server.port=${SERVER_PORT:8090}

# Config Server connection
spring.config.import=optional:configserver:http://13.52.157.48:8888

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://13.52.157.48:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Gateway routes configuration
# Route to API service
spring.cloud.gateway.routes[0].id=api-service
spring.cloud.gateway.routes[0].uri=lb://api-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/(?<segment>.*), /$\{segment}

# Actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# Logging configuration
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.web=INFO
logging.level.reactor.netty=INFO

# JVM memory optimization for t2.small
spring.jvm.memory=-Xmx256m -Xms128m
