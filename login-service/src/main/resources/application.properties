# This file is kept as a fallback but configuration is primarily in bootstrap.yml and from Config Server

# Spring Config Import
spring.config.import=optional:configserver:http://${IP_ADDRESS:13.52.157.48}:8888

# Actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging configuration
logging.level.com.example.loginservice=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.amqp=INFO

# JVM memory optimization for t2.small
spring.jvm.memory=-Xmx256m -Xms128m

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=aws-starter
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.username=${MONGO_USERNAME:admin}
spring.data.mongodb.password=${MONGO_PASSWORD:password}

# RabbitMQ Configuration (will be used when RabbitMQ is added)
# Set to false by default - can be enabled when RabbitMQ is available
rabbitmq.enabled=${RABBITMQ_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
