# Using local configuration instead of config server

# Spring Config Import - disabled config server
spring.config.import=optional:configserver:

# Actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging configuration
logging.level.com.example.loginservice=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.amqp=DEBUG

# JVM memory optimization for t2.small
spring.jvm.memory=-Xmx256m -Xms128m

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=aws-starter
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.username=${MONGO_USERNAME:admin}
spring.data.mongodb.password=${MONGO_PASSWORD:password}

# RabbitMQ Configuration
rabbitmq.enabled=true
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
rabbitmq.exchange.name=login-exchange
rabbitmq.queue.name=login.events.queue
rabbitmq.routing.key=login.events
