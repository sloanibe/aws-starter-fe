AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AWS Lambda functions for the AWS Starter API
  Replaces Spring Boot controllers with serverless functions

Parameters:
  MongoDbUri:
    Type: String
    Description: MongoDB connection string
    Default: mongodb://user:password@13.52.157.48:27017/aws_starter_db
    NoEcho: true
  
  Stage:
    Type: String
    Description: Deployment stage
    Default: prod
    AllowedValues:
      - dev
      - test
      - prod

Resources:
  # API Gateway definition
  ProjectsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'https://sloandev.net'"
      Auth:
        DefaultAuthorizer: NONE

  # GetAllProjects Lambda function
  GetAllProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.example.awsstarterapi.lambda.projects.GetAllProjectsHandler::handleRequest
      Runtime: java17
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ProjectsApi
            Path: /projects
            Method: get

Outputs:
  ProjectsApiUrl:
    Description: "URL of the Projects API"
    Value: !Sub "https://${ProjectsApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  
  GetAllProjectsFunction:
    Description: "GetAllProjects Lambda Function ARN"
    Value: !GetAtt GetAllProjectsFunction.Arn
